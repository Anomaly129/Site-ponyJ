<main><h1>Паспорт</h1>
<div class="passport">
<img src="img/photo.svg" alt="Фото">
<p><span>Фамилия:</span> <span id="sn">Иванов</span></p>
<p><span>Имя:</span> <span id="fn">Иван</span></p>
<p><span>Отчество:</span> <span id="pn">Иванович</span></p>
<p><span>Год рождения:</span> <span id="by">2000</span></p>
</div>

<button id="tr" type="button">Латиница</button>
</main><script src="style.js"></script><script>
var map={А:"A",Б:"B",В:"V",Г:"G",Д:"D",Е:"E",Ё:"E",Ж:"Zh",З:"Z",И:"I",Й:"Y",К:"K",Л:"L",М:"M",Н:"N",О:"O",П:"P",Р:"R",С:"S",Т:"T",У:"U",Ф:"F",Х:"Kh",Ц:"Ts",Ч:"Ch",Ш:"Sh",Щ:"Sch",Ы:"Y",Э:"E",Ю:"Yu",Я:"Ya",Ь:"",Ъ:""};
function lat(s){var r="";for(var i=0;i<s.length;i++){var c=s[i],u=c.toUpperCase();if(map[u]!==undefined){var t=map[u];r+=(c===u)?t:t.toLowerCase()}else r+=c}return r}
var orig={},ids=["sn","fn","pn"],on=false;
ids.forEach(function(i){orig[i]=document.getElementById(i).innerText});
document.getElementById("tr").onclick=function(){
 on=!on;
 ids.forEach(function(i){document.getElementById(i).innerText=on?lat(orig[i]):orig[i]});
 this.innerText=on?"Кириллица":"Латиница";
};
</script></body></html>
